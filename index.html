<title>令和8年熊本地震 被害状況ダッシュボード（7/29 18:00時点）</title>
<script>
// ===================== DATA（最新値） =====================
// 情報基準時：2026年7月29日18:00（日本時間）に収集した各出典の最新値。
// 指標ごとの「時点」は t フィールドを参照。null は「集計中」。
const DATA = {
  asOf: "7/29 18:00",
  asOfISO: "2026-07-29T18:00+09:00",
  version: "第7版（自動更新）",
  quake: {
    name: "令和8年熊本地震",
    occurred: "2026年7月28日 16:27ごろ",
    epicenter: "熊本県熊本地方",

  deaths:   { v: 8,     t: "7/29 11:00", src: "消防庁 被害報 第15報",
              note: "政府（首相）発表では13人（7/29 8:30時点・災害関連死の調査中を含む）、NHK熊本県まとめでは12人・心肺停止6人（7/29 3:53）。公的集計の確定を待って反映。" },
  missing:  { v: 7,     t: "7/29 10:12", src: "NHK（熊本県まとめ）",
              note: "「少なくとも7人」。日本製紙八代工場では9人安否不明との報道（7/29 7:18時点）もあり、集計中。" },
  injured:  { v: 29,    t: "7/29 11:00", src: "消防庁 被害報 第15報",
              note: "重傷6人・軽傷23人（熊本県22・鹿児島県1）。報道では28日夜時点で搬送50人以上とも。" },
  houses:   { v: null,  t: "—", src: "集計中",
              note: "全壊・半壊等の公的集計は精査中（速報値が版により変動しているため「集計中」表示）。報道ベースでは多数の建物被害。" },
  outage:   { v: 35640, t: "7/29 5:15", src: "九州電力（報道経由）",
              note: "29日朝時点で約3.5万戸。前夜0:30時点の42,440戸から減少。" },
  water:    { v: 84000, t: "7/29 昼", src: "報道値（毎日新聞・5県合計）",
              note: "県内内訳（NHK 9:30時点）：宇城市 約14,000戸、宇土市 約12,200戸、八代市・氷川町 計約28,500戸、熊本市南区 約9,000戸ほか。公的な県内合計は集計中。" },
  gas:      { v: 10481, t: "7/29 5:10", src: "都市ガス事業者",
              note: "八代市内の都市ガスは8月3日復旧見通し（報道）。熊本市東区秋津町481戸など。戸数はその後の公表なし。" },
  telecom:  { v: null,  t: "—", src: "総務省 第6報（7/28）",
              note: "携帯・固定の障害状況は総務省が被害情報を公表中。詳細戸数は集計中。" },
  evacuees: { v: 4700,  t: "7/29 早朝", src: "時事通信（36市町村）",
              note: "36市町村で4,700人超が避難所に避難。避難指示対象は別枠（熊本県 46,610世帯 92,743人＝消防庁第14報）。" },
  shelters: { v: 182,   t: "7/29 5:36", src: "熊本日日新聞（熊本市内）",
              note: "熊本市内の避難所数。県全体の箇所数は集計中。ペット同伴可2カ所・車中泊受入2カ所。" },
  rescueLaw:{ v: 21,    t: "7/28", src: "内閣府",
              note: "熊本県内21市町村に災害救助法を適用。" }

// ===================== HISTORY（推移） =====================
// 各レコード：時点、停電、断水、ガス、避難者、避難所、死者、安否不明。null=集計中。
const HISTORY = [
  { asOf: "7/29 5:10",  asOfISO: "2026-07-29T05:10+09:00", outage: 42440, water: 140000, gas: 10481, evacuees: 2344, shelters: 182, deaths: 1, missing: 19 },
  { asOf: "7/29 18:00", asOfISO: "2026-07-29T18:00+09:00", outage: 35640, water: 84000,  gas: 10481, evacuees: 4700, shelters: 182, deaths: 8, missing: 7 }
];

// ===================== 交通・救助・余震 =====================
const TRANSPORT = [
  { mode: "九州新幹線", status: "博多—筑後船小屋間は29日17時ごろから本数を減らして再開。筑後船小屋—鹿児島中央間は29日終日運休（レールが曲がる被害の報道）。", t: "7/29 14:00ごろ", src: "乗りものニュース／JR九州発表" },
  { mode: "在来線", status: "鹿児島本線 荒尾—八代間、豊肥本線 熊本—宮地間、三角線 全線で運転見合わせ。観光列車も終日運休。", t: "7/29 14:00ごろ", src: "JR九州発表（報道経由）" },
  { mode: "高速道路", status: "南九州自動車道 水俣IC—八代JCT 上下線などで通行止め（橋桁の段差）。", t: "7/29", src: "TBS/NEXCO西日本（報道経由）" },
  { mode: "空港", status: "熊本空港 発着13便欠航（28日〜）。滑走路に被害は確認されず。", t: "7/29 朝", src: "FNN（報道経由）" }
];
const RESCUE = [
  { site: "イオンモール熊本（嘉島町）", detail: "地震に伴うガス漏れとみられる爆発と2階部分の崩落。首相発表で3人死亡（7/29 10:00時点。それ以前の報道では死者2人・心肺停止1人）。救助活動継続中。" },
  { site: "日本製紙 八代工場（八代市）", detail: "煙突が中央付近から折損・倒壊。心肺停止2人・大けが2人、安否不明9人（7/29 7:18時点報道）。捜索続く。" },
  { site: "氷川町", detail: "住宅の座屈2件に消防が対応中（消防庁被害報）。" }
];
const AFTERSHOCK = "本震（7/28 16:27ごろ、M7.1・最大震度7）以降、地震活動が活発。震度5弱を観測する地震が3回発生（7/29時点）。気象庁は今後1週間程度、同程度の地震に注意を呼びかけ。県内では火災8件が発生し全て鎮火（消防庁）。";

// ===================== SOURCES =====================
const SOURCES = [
  { name: "消防庁 被害報 第15報（7/29 11:00）", url: "https://www.fdma.go.jp/disaster/info/items/20260728kumamotojishin15.pdf" },
  { name: "消防庁 被害報 第14報（7/29 7:00）", url: "https://www.fdma.go.jp/disaster/info/items/20260728kumamotojishin14.pdf" },
  { name: "気象庁 令和8年熊本地震 関連情報", url: "https://www.jma.go.jp/jma/menu/20260728_kumamoto_jishin.html" },
  { name: "内閣府 防災情報（被害状況・災害救助法適用）", url: "https://www.bousai.go.jp/updates/r8kumamoto_jishin/index.html" },
  { name: "内閣府 災害救助法の適用について（7/28）", url: "https://www.bousai.go.jp/pdf/260728.pdf" },
  { name: "総務省 被害情報 第6報（通信・放送）", url: "https://www.soumu.go.jp/menu_kyotsuu/important/kinkyu01_000683.html" },
  { name: "熊本県 令和8年熊本地震に関する情報", url: "https://www.pref.kumamoto.jp/soshiki/1/274517.html" },
  { name: "NHK 熊本県まとめ（死者・心肺停止・安否不明）", url: "https://news.web.nhk/newsweb/na/na-k10015189221000" },
  { name: "NHK 県内の断水状況（7/29 9:30時点）", url: "https://news.web.nhk/newsweb/na/nb-5000029430" },
  { name: "NHK 首相発表（イオンモール熊本・死者数）", url: "https://news.web.nhk/newsweb/na/na-k10015189461000" },
  { name: "NHK 日本製紙八代工場の被害", url: "https://news.web.nhk/newsweb/na/na-k10015188691000" },
  { name: "熊本日日新聞 給水所・断水（7/29 5:36）", url: "https://kumanichi.com/articles/2018975" },
  { name: "乗りものニュース 九州新幹線 一部再開（7/29）", url: "https://trafficnews.jp/post/692852" },
  { name: "時事通信 36市町村4,700人超避難（7/29）", url: "https://news.infoseek.co.jp/article/jiji_2026072900114/" },
  { name: "毎日新聞 断水8.4万戸・新幹線レール被害（7/29）", url: "https://news.yahoo.co.jp/articles/a27acef05f6f779b25a303d3de0675e5a9063b5d" },
  { name: "共同通信 死者13人か（7/29）", url: "https://news.yahoo.co.jp/articles/c450d7e7878e395586c9bce4913e10180fecbb14" }
];
</script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1a1f2b; --muted:#5b6472; --line:#e3e6eb;
    --accent:#0f6fb8; --danger:#c0392b; --warn:#b26a00; --ok:#1e7d4f;
    --chip:#eef2f6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141821; --card:#1d2330; --ink:#e8ebf0; --muted:#9aa4b2; --line:#2c3444;
           --accent:#5aa8e0; --danger:#e07060; --warn:#d9a04a; --ok:#5abf8a; --chip:#252d3c; }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.6; padding:20px; max-width:1100px; margin:0 auto;}
  header{border-left:6px solid var(--danger); padding:6px 0 6px 14px; margin-bottom:6px;}
  h1{font-size:1.35rem;}
  .meta{color:var(--muted); font-size:.85rem; margin-bottom:14px;}
  .meta b{color:var(--ink);}
  .banner{background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
          font-size:.82rem; color:var(--muted); margin-bottom:18px;}
  h2{font-size:1.02rem; margin:26px 0 10px; border-bottom:2px solid var(--line); padding-bottom:4px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .kpi-label{font-size:.8rem; color:var(--muted);}
  .kpi-value{font-size:1.7rem; font-weight:700; margin:2px 0;}
  .kpi-value.danger{color:var(--danger);} .kpi-value.warn{color:var(--warn);} .kpi-value.accent{color:var(--accent);}
  .kpi-sub{font-size:.74rem; color:var(--muted);}
  .kpi-note{font-size:.72rem; color:var(--muted); margin-top:6px; border-top:1px dashed var(--line); padding-top:5px;}
  .delta{font-size:.78rem; font-weight:600;}
  .delta.down{color:var(--ok);} .delta.up{color:var(--danger);}
  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
        border-radius:10px; overflow:hidden; font-size:.86rem;}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{background:var(--chip); font-size:.78rem; color:var(--muted); white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .src-list{font-size:.8rem; color:var(--muted); columns:2; column-gap:28px;}
  .src-list li{margin-bottom:4px; break-inside:avoid;}
  a{color:var(--accent); text-decoration:none;} a:hover{text-decoration:underline;}
  .spark{width:100%; height:46px; margin-top:4px;}
  footer{margin-top:30px; font-size:.75rem; color:var(--muted); border-top:1px solid var(--line); padding-top:10px;}
  @media(max-width:640px){ .src-list{columns:1;} }
</style>
</head>
<body>
<header>
  <h1 id="title">令和8年熊本地震 被害状況ダッシュボード</h1>
</header>
<div class="meta" id="meta"></div>
<div class="banner">数値は速報値であり今後変わりうる。公的発表を主表示とし、報道値は注記に併記。「集計中」は公的な確定値が未公表の指標。避難指示の対象人数と実際の避難者数は区別して表示。</div>

<h2>人的被害・避難</h2>
<div class="grid" id="kpi-human"></div>

<h2>ライフライン</h2>
<div class="grid" id="kpi-lifeline"></div>

<h2>推移（HISTORY）</h2>
<div style="overflow-x:auto"><table id="history-table"></table></div>

<h2>交通</h2>
<div style="overflow-x:auto"><table id="transport-table"></table></div>

<h2>主要救助事案</h2>
<div style="overflow-x:auto"><table id="rescue-table"></table></div>

<h2>余震・火災の状況</h2>
<div class="card" id="aftershock" style="font-size:.88rem;"></div>

<h2>出典</h2>
<ul class="src-list" id="sources"></ul>

<footer id="footer"></footer>

<script>
const fmt = v => v === null ? "集計中" : v.toLocaleString("ja-JP");
const q = DATA.quake;
document.getElementById("meta").innerHTML =
  `発生：<b>${q.occurred}</b>（${q.epicenter}、${q.magnitude}・深さ${q.depth}、最大${q.maxShindo}）｜` +
  `情報基準時：<b>${DATA.asOf}</b>（日本時間）｜${DATA.version}｜災害救助法適用：<b>${DATA.rescueLaw.v}市町村</b>（${DATA.rescueLaw.t}・${DATA.rescueLaw.src}）`;

const prev = HISTORY.length > 1 ? HISTORY[HISTORY.length-2] : null;
function deltaHtml(key, cur){
  if(!prev || cur === null || prev[key] == null) return "";
  const d = cur - prev[key];
  if(d === 0) return `<span class="delta">±0（前回 ${prev.asOf}）</span>`;
  const cls = d < 0 ? "down" : "up";
  return `<span class="delta ${cls}">${d>0?"+":""}${d.toLocaleString("ja-JP")}（前回 ${prev.asOf}）</span>`;
}
function spark(key){
  const vals = HISTORY.map(h=>h[key]).filter(v=>v!=null);
  if(vals.length < 2) return "";
  const max = Math.max(...vals), min = Math.min(...vals), range = (max-min)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1))*100},${40-((v-min)/range)*32}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function kpiCard(label, d, key, unit, cls){
  return `<div class="card">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value ${cls||""}">${fmt(d.v)}<span style="font-size:.85rem;font-weight:400"> ${d.v===null?"":unit}</span></div>
    <div class="kpi-sub">${d.t} 時点｜${d.src}</div>
    ${key?deltaHtml(key,d.v):""}${key?spark(key):""}
    ${d.note?`<div class="kpi-note">${d.note}</div>`:""}
  </div>`;
}
document.getElementById("kpi-human").innerHTML =
  kpiCard("死者", DATA.deaths, "deaths", "人", "danger") +
  kpiCard("安否不明者", DATA.missing, "missing", "人", "danger") +
  kpiCard("負傷者", DATA.injured, null, "人", "warn") +
  kpiCard("住家被害", DATA.houses, null, "棟", "warn") +
  kpiCard("避難者（避難所）", DATA.evacuees, "evacuees", "人超", "accent") +
  kpiCard("避難所数", DATA.shelters, "shelters", "カ所", "accent");
document.getElementById("kpi-lifeline").innerHTML =
  kpiCard("停電", DATA.outage, "outage", "戸", "warn") +
  kpiCard("断水", DATA.water, "water", "戸", "warn") +
  kpiCard("都市ガス供給停止", DATA.gas, "gas", "戸", "warn") +
  kpiCard("通信障害", DATA.telecom, null, "", "");

const keys = [["asOf","時点"],["deaths","死者"],["missing","安否不明"],["outage","停電（戸）"],["water","断水（戸）"],["gas","ガス（戸）"],["evacuees","避難者"],["shelters","避難所"]];
document.getElementById("history-table").innerHTML =
  `<tr>${keys.map(k=>`<th>${k[1]}</th>`).join("")}</tr>` +
  HISTORY.map(h=>`<tr>${keys.map(k=>`<td>${k[0]==="asOf"?h[k[0]]:fmt(h[k[0]])}</td>`).join("")}</tr>`).join("");

document.getElementById("transport-table").innerHTML =
  `<tr><th>交通機関</th><th>状況</th><th>時点・出典</th></tr>` +
  TRANSPORT.map(t=>`<tr><td style="white-space:nowrap"><b>${t.mode}</b></td><td>${t.status}</td><td style="font-size:.78rem;color:var(--muted)">${t.t}<br>${t.src}</td></tr>`).join("");

document.getElementById("rescue-table").innerHTML =
  `<tr><th>現場</th><th>状況</th></tr>` +
  RESCUE.map(r=>`<tr><td style="white-space:nowrap"><b>${r.site}</b></td><td>${r.detail}</td></tr>`).join("");

document.getElementById("aftershock").textContent = AFTERSHOCK;

document.getElementById("sources").innerHTML =
  SOURCES.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a></li>`).join("");

document.getElementById("footer").innerHTML =
  `本ダッシュボードは自動更新。数値は各出典の速報値で、指標ごとに「時点」が異なる。断水の主表示は報道値（5県合計）であり、公的な県内合計の公表後に差し替え予定。住家被害は公的速報の変動が大きいため「集計中」。｜作成：土屋（経営コンサルタント）／状況把握・クライアント説明・講演教材用`;
</script>
</body>
</html>
