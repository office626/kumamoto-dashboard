<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>令和8年熊本地震 被害状況ダッシュボード（7/29 07:00基準）</title>
<script>
// ===================== DATA =====================
// 情報基準時：2026年7月29日 07:00（消防庁第14報）ほか、各指標の時点は tp を参照
const DATA = {
  asOf: "7/29 7:00",
  asOfISO: "2026-07-29T07:00+09:00",
  version: "7/29 07:00基準版（消防庁第14報反映・自動更新）",
  quake: {
    name: "令和8年熊本地震",
    occurred: "2026-07-28T16:27+09:00",
    epicenter: "熊本県熊本地方",
    magnitude: 7.1,
    depth: "約10km",
    maxIntensity: "震度7（宇城市・氷川町）",

  },

  outage: 35640,        // 九州電力公表（7/29 5:00現在、八代市・宇城市など）

  gas: 10481,           // 既報値（7/29 5:10版から更新なし）。参考：西部ガス（都市ガス）約500戸供給停止（7/28 18:30）、熊本市東区秋津町481戸（7/29 0:30）
  telecom: "停電に伴う基地局停波が県南部を中心に発生（詳細集計中）",
  evacuees: 4700,       // 時事通信（7/29朝）：県内36市町村で4,700人超 ※前回値2,344人は熊本市のみの集計。集計範囲が異なるため単純比較不可
  evacueesScope: "県内36市町村（報道）",
  shelters: 182,        // 熊本市開設分（7/29 0:30、第3回熊本市災対本部会議）。県全域の避難所数は集計中。宇城市・氷川町では避難所を開設できず車中泊用に駐車場等を開放
  evacOrder: "避難指示 46,610世帯・92,743人（消防庁第14報）",
  kyujoLaw: 21,         // 災害救助法適用：熊本県21市町村（10市10町1村、7/28 内閣府）
  rescue: [
    { site: "イオンモール熊本（嘉島町）", detail: "地震後にガス漏れが原因とみられる爆発、2階部分が崩落。死者2人（20代女性ほか）・心肺停止1人・8人救助（29日4時現在・NHK）。約10人と連絡が取れず捜索継続（29日朝・報道）", status: "捜索中" },
    { site: "日本製紙 八代工場（八代市）", detail: "煙突が中央付近から折れて倒壊。2人心肺停止・9人安否不明（29日朝時点・報道）。救助活動継続中", status: "捜索中" }
  ],
  transport: [
    { mode: "九州新幹線", detail: "29日始発から全線運休（JR九州）" },
    { mode: "JR在来線ほか", detail: "8事業者12路線が運転見合わせ（国交省 7/28 21:00）" },
    { mode: "高速道路", detail: "4路線29区間通行止め（国交省 7/28 21:00）" },
    { mode: "国道", detail: "熊本市内 国道3号の一部（〜釈迦堂橋間）通行止めほか、八代市で道路高架の被害情報" },
    { mode: "熊本空港", detail: "滑走路閉鎖は28日19:05に解除。28日は29便欠航。29日は運航状況を要確認" },
    { mode: "港湾", detail: "八代港：岸壁背後に段差・液状化・陥没2箇所。熊本港：フェリー渡橋損傷のため使用不可" },
    { mode: "バス", detail: "高速バス8事業者31路線運休、路線バス3事業者が全路線運休（7/28時点）" },
    { mode: "熊本市電", detail: "29日始発から運行再開予定（熊本市 7/29 0:30）" }
  ],
  sources: [
    { name: "消防庁 被害報 第14報（7/29 7:00現在）", url: "https://www.fdma.go.jp/disaster/info/items/20260728kumamotojishin14.pdf" },
    { name: "国土交通省 被害状況等 第2報（7/28 21:00時点）", url: "https://www.mlit.go.jp/common/002014121.pdf" },
    { name: "内閣府 災害救助法の適用について（7/28）", url: "https://www.bousai.go.jp/pdf/260728.pdf" },
    { name: "熊本市 災害対策本部会議資料（第3回・7/29 1:00）", url: "https://www.city.kumamoto.jp/kiji00372080/index.html" },
    { name: "熊本県 災害対策本部会議（第2回・7/29 0:00）", url: "https://www.pref.kumamoto.jp/soshiki/222/274487.html" },
    { name: "気象庁 令和8年熊本地震 関連情報", url: "https://www.jma.go.jp/jma/menu/20260728_kumamoto_jishin.html" },
    { name: "熊本日日新聞：県内3.5万戸停電 九電公表（7/29 5:40）", url: "https://kumanichi.com/articles/2019019" },
    { name: "熊本日日新聞：21市町村に災害救助法適用", url: "https://kumanichi.com/articles/2018825" },
    { name: "NHK：イオンモール熊本で爆発 2人死亡（7/29 5:32）", url: "https://news.web.nhk/newsweb/na/na-k10015189291000" },
    { name: "NHK：日本製紙八代工場 煙突倒壊（7/28 18:48）", url: "https://news.web.nhk/newsweb/na/na-k10015188691000" },
    { name: "西日本新聞（共同）：約14万戸断水 給水車派遣を要請", url: "https://www.nishinippon.co.jp/item/1520891/" },
    { name: "時事通信：36市町村4,700人超避難（7/29朝）", url: "https://news.infoseek.co.jp/article/jiji_2026072900114/" }
  ],
  notes: [
    "死者数は消防庁第14報（7/29 7:00現在）の公的発表値。報道ではイオンモール熊本で2人死亡・1人心肺停止、日本製紙八代工場で2人心肺停止とされており、今後公的集計に反映され増加する可能性がある。",
    "安否不明者数19人は報道ベースの合算値（公的な確定値は集計中）。",
    "避難者数は今回から県内全域（36市町村・報道）の集計に変更。前回値2,344人は熊本市のみの集計のため、増加分の大半は集計範囲の拡大による。避難所数182か所は引き続き熊本市開設分のみ。",
    "ガス供給停止戸数は7/29 5:10版から新しい公表値が確認できず既報値を継続掲載。",
    "断水戸数は7/28夜時点の国交省集計（17市町村・約14万戸）。",
    "数値はいずれも速報値であり、今後の発表で変わり得る。"
  ]
};

// ===================== HISTORY =====================
// 注：7/29 5:10以前の履歴は本自動更新時に既存版を取得できなかったため、5:10版（ベースライン）以降を掲載
const HISTORY = [
  { asOf: "7/29 5:10", outage: 42440, water: 140000, gas: 10481, evacuees: 2344, shelters: 182, deaths: 1, missing: 19 },
  { asOf: "7/29 7:00", outage: 35640, water: 140000, gas: 10481, evacuees: 4700, shelters: 182, deaths: 3, missing: 19 }
];
</script>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --ink:#1a202c; --ink2:#4a5568; --muted:#718096;
    --line:#e2e8f0; --accent:#2563a8;
    --critical:#b3261e; --serious:#c2410c; --warning:#a16207; --good:#15803d;
    --critical-bg:#fdecea; --serious-bg:#fff1e7; --warning-bg:#fdf6e3; --good-bg:#eaf6ee;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; padding:16px;}
  .wrap{max-width:1100px; margin:0 auto;}
  header{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 24px; margin-bottom:16px;}
  header h1{font-size:1.35rem; margin-bottom:4px;}
  .asof{color:var(--ink2); font-size:.9rem;}
  .asof strong{color:var(--critical);}
  .quake{margin-top:10px; font-size:.88rem; color:var(--ink2); border-top:1px dashed var(--line); padding-top:10px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .tile .label{font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .tile .value{font-size:1.7rem; font-weight:700; letter-spacing:.02em; margin:2px 0;}
  .tile .unit{font-size:.85rem; font-weight:400; color:var(--ink2);}
  .tile .tp{font-size:.72rem; color:var(--muted);}
  .tile .delta{font-size:.78rem; font-weight:600;}
  .up{color:var(--critical);} .down{color:var(--good);} .flat{color:var(--muted);}
  .tile.critical{border-left:4px solid var(--critical); background:var(--critical-bg);}
  .tile.serious{border-left:4px solid var(--serious); background:var(--serious-bg);}
  .tile.warning{border-left:4px solid var(--warning); background:var(--warning-bg);}
  section{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 22px; margin-bottom:16px;}
  section h2{font-size:1.02rem; margin-bottom:10px; padding-left:10px; border-left:4px solid var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{background:#f1f4f8; font-weight:600; color:var(--ink2); white-space:nowrap;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .badge{display:inline-block; font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:10px; background:var(--serious-bg); color:var(--serious); white-space:nowrap;}
  ul.notes{font-size:.82rem; color:var(--ink2); padding-left:1.2em;}
  ul.notes li{margin-bottom:4px;}
  .src a{color:var(--accent); text-decoration:none; word-break:break-all;}
  .src li{margin-bottom:3px; font-size:.82rem;}
  footer{font-size:.75rem; color:var(--muted); text-align:center; padding:8px 0 20px;}
  @media (max-width:600px){ .tile .value{font-size:1.4rem;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="asof" id="asof"></div>
    <div class="quake" id="quakeinfo"></div>
  </header>

  <div class="grid" id="tiles"></div>

  <section>
    <h2>主要救助事案</h2>
    <table id="rescue"><thead><tr><th>現場</th><th>状況</th><th>ステータス</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>交通の状況</h2>
    <table id="transport"><thead><tr><th>交通機関</th><th>状況</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>推移（HISTORY）</h2>
    <table id="history"><thead><tr>
      <th>時点</th><th class="num">死者</th><th class="num">安否不明</th><th class="num">停電（戸）</th><th class="num">断水（戸）</th><th class="num">ガス停止（戸）</th><th class="num">避難者</th><th class="num">避難所</th>
    </tr></thead><tbody></tbody></table>
    <p style="font-size:.78rem;color:var(--muted);margin-top:6px;">※7/29 7:00版の避難者数から県内全域集計（報道）に変更（5:10版までは熊本市のみ）。避難所数は熊本市開設分。</p>
  </section>

  <section>
    <h2>注記</h2>
    <ul class="notes" id="notes"></ul>
  </section>

  <section class="src">
    <h2>出典</h2>
    <ul id="sources"></ul>
  </section>

  <footer id="footer"></footer>
</div>

<script>
(function(){
  const fmt = n => n==null ? "集計中" : n.toLocaleString("ja-JP");
  const q = DATA.quake;
  document.getElementById("title").textContent = q.name + " 被害状況ダッシュボード";
  document.getElementById("asof").innerHTML =
    "情報基準時：<strong>" + DATA.asOf + "</strong>（日本時間）｜ " + DATA.version;
  document.getElementById("quakeinfo").innerHTML =
    "発生：7月28日16:27ごろ ｜ 震源：" + q.epicenter + " ｜ M" + q.magnitude + " ｜ 深さ" + q.depth +
    " ｜ 最大" + q.maxIntensity + "<br>余震等：" + q.aftershock;

  const prev = HISTORY.length >= 2 ? HISTORY[HISTORY.length-2] : null;
  function delta(key, invert){
    if(!prev || prev[key]==null || DATA[key]==null) return "";
    const d = DATA[key] - prev[key];
    if(d===0) return '<span class="delta flat">前回比 ±0</span>';
    const cls = (d>0) ? "up" : "down";
    return '<span class="delta '+cls+'">前回比 '+(d>0?"+":"")+d.toLocaleString("ja-JP")+'</span>';
  }
  const tiles = [
    {label:"死者", value:fmt(DATA.deaths), unit:"人", tp:"消防庁 第14報（7/29 7:00現在）", cls:"critical", d:delta("deaths")},
    {label:"安否不明", value:fmt(DATA.missing), unit:"人", tp:"報道合算（29日朝）※公的値は集計中", cls:"critical", d:delta("missing")},
    {label:"負傷者", value:fmt(DATA.injuries), unit:"人（重傷"+DATA.injuriesSevere+"・軽傷"+DATA.injuriesMinor+"）", tp:"消防庁 第14報", cls:"serious", d:""},
    {label:"避難者", value:fmt(DATA.evacuees)+"超", unit:"人", tp:DATA.evacueesScope+"（29日朝）※集計範囲変更", cls:"serious", d:""},
    {label:"避難所", value:fmt(DATA.shelters), unit:"か所（熊本市）", tp:"7/29 0:30 熊本市災対本部", cls:"warning", d:delta("shelters")},
    {label:"停電", value:fmt(DATA.outage), unit:"戸", tp:"九州電力（7/29 5:00現在）", cls:"warning", d:delta("outage")},
    {label:"断水", value:"約"+fmt(DATA.water), unit:"戸（17市町村）", tp:"国交省集計（7/28夜）", cls:"warning", d:delta("water")},
    {label:"ガス供給停止", value:fmt(DATA.gas), unit:"戸", tp:"既報値（新規公表なし）", cls:"warning", d:delta("gas")},
    {label:"住家被害", value:fmt(DATA.housing.full+DATA.housing.half+DATA.housing.partial), unit:"棟（全壊"+DATA.housing.full+"・半壊"+DATA.housing.half+"・一部破損"+DATA.housing.partial+"）", tp:"消防庁 第14報 ※集計初期", cls:"warning", d:""},
    {label:"災害救助法 適用", value:fmt(DATA.kyujoLaw), unit:"市町村（10市10町1村）", tp:"内閣府（7/28）", cls:"serious", d:""}
  ];
  document.getElementById("tiles").innerHTML = tiles.map(t =>
    '<div class="tile '+(t.cls||"")+'"><div class="label">'+t.label+'</div>'+
    '<div class="value">'+t.value+' <span class="unit">'+t.unit+'</span></div>'+
    (t.d||'')+'<div class="tp">'+t.tp+'</div></div>').join("");

  document.querySelector("#rescue tbody").innerHTML = DATA.rescue.map(r =>
    "<tr><td><strong>"+r.site+"</strong></td><td>"+r.detail+'</td><td><span class="badge">'+r.status+"</span></td></tr>").join("");

  document.querySelector("#transport tbody").innerHTML = DATA.transport.map(t =>
    "<tr><td style='white-space:nowrap'><strong>"+t.mode+"</strong></td><td>"+t.detail+"</td></tr>").join("");

  document.querySelector("#history tbody").innerHTML = HISTORY.map(h =>
    "<tr><td>"+h.asOf+'</td><td class="num">'+fmt(h.deaths)+'</td><td class="num">'+fmt(h.missing)+'</td><td class="num">'+fmt(h.outage)+'</td><td class="num">'+fmt(h.water)+'</td><td class="num">'+fmt(h.gas)+'</td><td class="num">'+fmt(h.evacuees)+'</td><td class="num">'+fmt(h.shelters)+"</td></tr>").join("");

  document.getElementById("notes").innerHTML = DATA.notes.map(n => "<li>"+n+"</li>").join("");
  document.getElementById("sources").innerHTML = DATA.sources.map(s =>
    '<li><a href="'+s.url+'" target="_blank" rel="noopener">'+s.name+"</a></li>").join("");
  document.getElementById("footer").textContent =
    "本ダッシュボードは速報値に基づく参考情報です。数値は今後の公的発表により変わることがあります。｜ 情報基準時 " + DATA.asOf + "（JST）";
})();
</script>
</body>
</html>
